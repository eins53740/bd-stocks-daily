# brokers.yaml — Broker fee & market-coverage reference for the cost comparator (Phase 8)
# =============================================================================
# CAVEAT — READ BEFORE TRUSTING ANY NUMBER HERE
# Broker fee schedules change frequently (often several times a year) and vary
# by account type, promotion, residency and order routing. Every fee value
# below carries an `as_of` date and a `source` note. Values marked
# `approx: true` are reasonable estimates, NOT quoted tariffs — verify on the
# broker's live fee page before acting. This file needs a PERIODIC MANUAL
# REFRESH. Last full review: 2026-06.
#
# Scope: exactly the 9 brokers the user actually holds:
#   IBKR, DEGIRO, Trade Republic, Robinhood, Revolut, XTB,
#   Banco BIG, Banco CTT, Banco BEST.
#
# Schema (per broker):
#   name:              display name
#   profile:           one-line positioning
#   base_currency:     account funding currency (drives FX applicability)
#   fx_fee_pct:        cost to convert EUR->local for a non-base-currency trade
#                      (percentage of traded notional, charged once per leg)
#   custody_fee:       free-text custody / inactivity note (annualised, not per-trade)
#   markets:           map of MARKET_KEY -> per-market fee block, OR absent =>
#                      broker does NOT offer that market (excluded from compare)
#
#   Per-market fee block:
#     commission_pct:  variable commission as % of notional (per leg)
#     commission_min:  minimum commission in EUR (per leg); 0 = no minimum
#     commission_max:  cap in EUR (per leg); null = uncapped
#     flat_fee:        fixed per-order fee in EUR (per leg), added to commission
#     market_data_fee: free-text note (annual/one-off; NOT added to round-trip)
#     dividend_fee:    free-text note (NOT added to a buy/sell round-trip)
#     other_costs:     free-text note on hidden costs (FX spread, conversion, etc.)
#     as_of:           "YYYY-MM" the figure was last verified
#     source:          where the figure came from
#     approx:          true if the number is an estimate, not a quoted tariff
#
# MARKET_KEY values used by broker_compare.py (the spec's 7 example markets):
#   US        NYSE / Nasdaq (USD)
#   IE        Euronext Dublin / ISEQ (EUR)
#   PT        Euronext Lisbon (EUR)
#   TW        Taiwan Stock Exchange (TWD)
#   HK        Hong Kong Stock Exchange (HKD)
#   JP        Tokyo Stock Exchange (JPY)
#   CN_SZ     Shenzhen Stock Exchange (CNY, via Stock-Connect where offered)
# =============================================================================

