# brokers.yaml — Broker fee & market-coverage reference for the cost comparator (Phase 8)
# =============================================================================
# CAVEAT — READ BEFORE TRUSTING ANY NUMBER HERE
# Broker fee schedules change frequently (often several times a year) and vary
# by account type, promotion, residency and order routing. Every fee value
# below carries an `as_of` date and a `source` note. Values marked
# `approx: true` are reasonable estimates, NOT quoted tariffs — verify on the
# broker's live fee page before acting. This file needs a PERIODIC MANUAL
# REFRESH. Last full review: 2026-08-17.
#
# ---------------------------------------------------------------------------
# 2026-08-17 REFRESH — what changed and why it mattered
#
# The market list went from 11 keys to 32: the 32 regions the weekly prefilter actually
# reported coverage for. Twenty-one regions of the live pool had NO market key at all, so the
# comparator's honest answer for an ASX, TSX, SIX, BME, Nasdaq-Nordic or KRX name was "no
# broker offers this" — indistinguishable from "nobody checked".
#
# Two brokers were re-read from their own published schedules, in full, and parsed by code
# rather than transcribed by eye:
#   * IBKR   — the per-country stock-commission page, 30 markets. It refuses automated
#              fetch (403) but answers a plain browser User-Agent, the same missing-header
#              cause as the SEC/EDGAR 403 this skill already fixed.
#   * DEGIRO — the Fee Schedule PDF, "Rates from: 01-01-2026", 23 markets. Its exchange list
#              is EXHAUSTIVE, which is why DEGIRO is the one broker whose absences are facts.
#
# THREE ERRORS THIS REFRESH CORRECTED, all in the same direction and all material:
#   * IBKR's Asian minimums had been entered as LOCAL-CURRENCY numbers into a field the
#     schema defines as EUR. HK read 18.0 EUR when HKD 18.00 is EUR 1.98; JP read 8.0 EUR
#     when JPY 80 is EUR 0.43; TW read 15.0 EUR against TWD 80 = EUR 2.17. IBKR's cost in
#     Asia was overstated by 9x, 18x and 7x — enough to hand a "cheapest broker" verdict to
#     someone else on every Asian name in the pool. Local minimums are now stored verbatim
#     BESIDE the EUR value, with the FX rate and its date, so the conversion is auditable.
#   * IBKR's Taiwan commission was 0.15%; the published tariff is 0.08%.
#   * DEGIRO's Euronext Dublin was 3.90; the published fee is 2.00 (+1.00 handling).
#
# NOT fabricated, and still open: the four Portuguese banks (BIG, CTT, BEST, Bankinter) and
# eToro. Their tariffs live in preçário PDFs that refuse automated fetch, so their new-market
# coverage is recorded as UNKNOWN rather than filled in. See `coverage_unknown` below.
# ---------------------------------------------------------------------------
#
# Scope (v4.3 wave 4.5): 10 brokers — the 9 held plus Bankinter:
#   IBKR, DEGIRO, Trade Republic, Robinhood, Revolut, XTB,
#   Banco BIG, Banco CTT, Banco BEST, Bankinter,
#   plus eToro and Trading212 as SCHEMA-ONLY entrants (see below).
#
# ---------------------------------------------------------------------------
# WHY SOME ENTRIES CARRY NO NUMBERS (v4.3 wave 4.5)
# Three brokers were added to the comparator this wave: eToro, Trading 212 and
# Bankinter. Their tariffs were NOT invented. A fabricated commission in a file
# the owner uses to decide where to place real money is worse than an obvious
# gap, so each carries `verified: false`, an empty `markets:` map and a
# `pending_verification` list naming exactly what has to be filled in and from
# where. `broker_compare.py` excludes an unverified broker from every cost
# matrix and reports it separately, so it can never win a "cheapest" row on
# numbers nobody checked.
#
# The STATUTORY fields below (investor compensation, deposit-guarantee
# treatment of cash) are a different class of fact: they come from law, not
# from a tariff sheet, they change on a scale of years, and they are stated
# with their scheme name. They are filled in.
# ---------------------------------------------------------------------------
#
# Schema (per broker):
#   name:              display name
#   profile:           one-line positioning
#   base_currency:     account funding currency (drives FX applicability)
#   fx_fee_pct:        cost to convert EUR->local for a non-base-currency trade
#                      (percentage of traded notional, charged once per leg)
#   custody_fee:       free-text custody / inactivity note (annualised, not per-trade)
#   verified:          false => tariffs unconfirmed; excluded from cost matrices
#   cash_interest:     interest paid on UNINVESTED cash (free text + as_of)
#   investor_compensation: statutory investor-compensation scheme + cover
#   cash_protection_100k:  is EUR 100k of CASH protected on insolvency, and HOW —
#                      deposit guarantee (cash held as a deposit at a credit
#                      institution) vs segregated client money (not a deposit)
#   dividend_handling: how dividends arrive (auto-credit, FX applied, fees)
#   fx_spread_note:    the spread ON TOP of any quoted fx_fee_pct
#   markets:           map of MARKET_KEY -> per-market fee block
#   not_offered:       comma-separated MARKET_KEYs the broker was CHECKED against and does
#                      not reach. A sourced no.
#   coverage_unknown:  comma-separated MARKET_KEYs NOBODY HAS CHECKED. Absence used to mean
#                      "not offered", which was safe with 7 checked markets and false with
#                      32: an unresearched market would read as a confirmed no, silently
#                      dropping a broker from a whole region with nothing to show the gap.
#                      markets + not_offered + coverage_unknown == every key in markets_meta,
#                      and a test asserts exactly that so a new market cannot be added to
#                      markets_meta without every broker being placed in one of the three.
#   coverage_note:     why the split above falls where it does, per broker.
#
#   Per-market fee block:
#     commission_pct:  variable commission as % of notional (per leg)
#     commission_min:  minimum commission in EUR (per leg); 0 = no minimum
#     commission_max:  cap in EUR (per leg); null = uncapped
#     flat_fee:        fixed per-order fee in EUR (per leg), added to commission
#     market_data_fee: free-text note (annual/one-off; NOT added to round-trip)
#     dividend_fee:    free-text note (NOT added to a buy/sell round-trip)
#     other_costs:     free-text note on hidden costs (FX spread, conversion, etc.)
#     as_of:           "YYYY-MM" the figure was last verified
#     source:          where the figure came from
#     approx:          true if the number is an estimate, not a quoted tariff
#     commission_min_local / commission_max_local / fx_rate_eur_local / fx_as_of:
#                      the tariff as the broker actually publishes it, in the venue's own
#                      currency, plus the rate used to reach the EUR figure above and the day
#                      that rate was read. The EUR number is what the comparator arithmetic
#                      needs; these four are what make it checkable and refreshable, instead
#                      of a converted figure that ages with nothing to show for it.
#     pricing_basis:   set where the tariff is NOT a percentage of notional — IBKR prices US
#                      and Canadian stocks PER SHARE. At every ticket size compared here the
#                      per-order minimum is what actually gets paid, so commission_pct is 0
#                      and the per-share rate is stated in other_costs rather than faked as a
#                      percentage that would only be right at one share price.
#     sell_to_close_only: the venue can be sold but not bought (DEGIRO/Budapest).
#
# MARKET_KEY values: see markets_meta at the foot of this file — 32 keys, one per region the
# universe actually holds, each with its label, currency and the Yahoo suffix the pipeline
# uses. That block is the authority; MARKET_ORDER in broker_compare.py must agree with it.
# =============================================================================

