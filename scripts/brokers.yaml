# =============================================================================
# markets_meta — one entry per REGION THE UNIVERSE ACTUALLY HOLDS.
#
# The list is not a wish list: it is the 32 regions the weekly prefilter reported coverage
# for on 2026-08-17. Before this refresh the file described 11 of them, so 21 regions of the
# pool — including every name in AU (200 candidates), JP (122), CA (62), IN (54) and CH (24)
# — had no cost comparison at all, and the comparator answered "no broker offers this"
# because the market key simply did not exist.
#
# `yahoo_suffix` is the ticker suffix the pipeline itself uses, so a report can look its own
# market up without a second mapping table. Deliberately NOT stored here: the pool pass/total
# counts. Those live in `_prefilter_stats.json`, are rewritten every Monday, and copying them
# into a reference file would only create a number that silently ages.
# =============================================================================
