<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root{
    --ink:#1B2A32;--muted:#5B6B66;--line:#E4EAE7;--bg:#F4F7F5;--card:#FFFFFF;
    --bd-green:#1F8A5B;--bd-teal:#0E6E6E;--gold:#E8B23A;
    --great:#1F8A5B;--invest:#4CAF7D;--review:#E8B23A;--reject:#D1495B;
    --shadow:0 1px 3px rgba(20,40,50,.07),0 8px 22px rgba(20,40,50,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.55;font-size:15px}
  .wrap{max-width:1060px;margin:0 auto;padding:0 20px 60px;display:grid;grid-template-columns:200px 1fr;gap:26px}
  /* ---- HEADER BAND (answer-first) ---- */
  header{grid-column:1/-1;background:linear-gradient(120deg,#12332a,#0E6E6E);color:#fff;border-radius:0 0 18px 18px;
    padding:16px 22px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;box-shadow:var(--shadow)}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .brand-icon{width:46px;height:46px;border-radius:12px;object-fit:cover;border:2px solid rgba(255,255,255,.6);flex:none}
  .brand-txt{display:flex;flex-direction:column;line-height:1.1}
  .wm{font-family:Georgia,serif;font-size:22px;font-weight:700}
  .wm b{color:var(--gold)}
  .brand-txt small{font-size:9.5px;letter-spacing:3px;color:#cfe6dc;font-weight:700;margin-top:2px}
  .hdr-mid{min-width:0}
  .hdr-mid .tk{font-size:22px;font-weight:800;letter-spacing:.3px}
  .hdr-mid .sub{color:#cfe6dc;font-size:12.5px;margin-top:1px}
  .hdr-mid .decide{margin-top:9px;font-size:14px;background:rgba(255,255,255,.12);border-radius:9px;padding:7px 11px;display:inline-block}
  .hdr-mid .decide b{color:#ffe6a3}
  .hdr-right{display:flex;align-items:center;gap:14px}
  .verdict{padding:7px 15px;border-radius:999px;font-weight:800;font-size:14px;color:#fff;background:var(--review)}
  .verdict.great{background:var(--great)}.verdict.invest{background:var(--invest)}
  .verdict.review{background:var(--review);color:#12332a}.verdict.fair{background:var(--gold);color:#12332a}.verdict.reject{background:var(--reject)}
  .dial{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--great);font-weight:800;font-size:23px;box-shadow:inset 0 0 0 4px rgba(31,138,91,.25)}
  .dial small{display:block;font-size:9px;color:var(--muted);font-weight:700;letter-spacing:.5px}
  /* nav */
  nav{position:sticky;top:14px;align-self:start;font-size:13px}
  nav a{display:block;color:var(--muted);text-decoration:none;padding:5px 10px;border-left:2px solid transparent;border-radius:0 6px 6px 0}
  nav a:hover{color:var(--bd-green);border-left-color:var(--bd-green);background:#eef4f1}
  nav .tag{margin-top:12px;font-size:10px;letter-spacing:2px;color:#a9791a;font-weight:700}
  main{min-width:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px 19px;margin:0 0 16px;box-shadow:var(--shadow)}
  .card h2{margin:0 0 12px;font-size:15.5px;display:flex;align-items:center;gap:9px}
  .card h2 .pip{width:9px;height:9px;border-radius:2px;background:var(--bd-green)}
  .new{font-size:9.5px;font-weight:700;letter-spacing:.5px;color:#fff;background:var(--bd-teal);padding:2px 7px;border-radius:6px;margin-left:auto}
  /* hero: snowflake + tearsheet */
  .hero{grid-column:1/-1;display:grid;grid-template-columns:230px 1fr;gap:16px;margin-top:14px}
  @media(max-width:820px){.hero{grid-template-columns:1fr}}
  .snow{display:grid;place-items:center}
  .snow figcaption{font-size:11px;color:var(--muted);text-align:center;margin-top:4px}
  .snow svg{max-width:100%;height:auto}
  .strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .metric{border:1px solid var(--line);border-radius:11px;padding:9px 11px}
  .metric .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .metric .v{font-size:17px;font-weight:700;margin-top:2px;display:flex;align-items:baseline;gap:6px}
  .metric .spark{margin-top:3px}
  .up{color:var(--great)}.dn{color:var(--reject)}
  .sub{font-size:11px;color:var(--muted)}
  /* fair value gauge */
  .gauge{position:relative;height:26px;border-radius:8px;margin:16px 0 26px;
    background:linear-gradient(90deg,var(--reject) 0%,var(--gold) 45%,var(--invest) 70%,var(--great) 100%)}
  .gauge .seg{position:absolute;top:-20px;font-size:10.5px;color:var(--muted);transform:translateX(-50%)}
  .gauge .you{position:absolute;top:-9px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:12px solid var(--ink);transform:translateX(-50%)}
  .gauge .you b{position:absolute;top:-30px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;color:var(--ink)}
  /* range bar (bear/base/bull) */
  .range{position:relative;height:10px;background:var(--line);border-radius:6px;margin:22px 0 10px}
  .range .fill{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#f3c9cf,#cdeede);border-radius:6px}
  .range .tick{position:absolute;top:-7px;width:2px;height:24px;background:var(--ink)}
  .range .tick span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:10.5px;white-space:nowrap}
  /* tables */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.3px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .grade{display:inline-block;min-width:26px;text-align:center;font-weight:800;border-radius:6px;padding:1px 5px;font-size:12px}
  .gA{background:#e7f2ec;color:#1c7a50}.gB{background:#eef6ea;color:#4a8f2f}.gC{background:#fdf6e6;color:#a9791a}.gD{background:#fbedef;color:#b23b4c}
  /* callouts / symmetry */
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:640px){.two{grid-template-columns:1fr}}
  .side{border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .side h3{margin:0;padding:8px 12px;font-size:13px;color:#fff}
  .side.bull h3{background:var(--bd-green)} .side.bear h3{background:var(--reject)}
  .side ul{margin:9px 0;padding:0 14px 4px 26px;font-size:13.5px} .side li{margin:5px 0}
  /* exit grid */
  .exit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:4px}
  .exit-grid .box{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .exit-grid .box .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .exit-grid .box .v{font-size:16px;font-weight:700;margin-top:2px}
  .callout{border-left:4px solid var(--gold);background:#fdf6e6;border-radius:0 10px 10px 0;padding:10px 13px;margin:10px 0;font-size:13px}
  /* traffic-light flags */
  .flags{list-style:none;margin:0;padding:0}
  .flags li{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .flags li:last-child{border-bottom:0}
  .pill{flex:none;font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;display:inline-flex;gap:4px;align-items:center}
  .pill.ok{background:#e7f2ec;color:#1c7a50}.pill.warn{background:#fdf6e6;color:#a9791a}.pill.bad{background:#fbedef;color:#b23b4c}
  /* opinion panel */
  .op{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  @media(max-width:640px){.op{grid-template-columns:1fr}}
  .op .oc{border:1px solid var(--line);border-radius:11px;padding:9px 11px}
  .op .oc .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .op .oc .v{font-size:15px;font-weight:700;margin:2px 0}
  .bar{position:relative;height:8px;border-radius:5px;background:var(--line);margin:5px 0 3px}
  .bar .f{position:absolute;top:0;bottom:0;left:0;border-radius:5px;background:var(--bd-green)}
  .bar .mid{position:absolute;top:-2px;bottom:-2px;left:50%;width:1px;background:var(--muted)}
  .disc{grid-column:1/-1;background:#fdf6e6;border:1px solid #f0e2b8;border-radius:10px;padding:9px 13px;color:#8a6d13;font-size:12px;margin-top:14px}
  .nabox{color:var(--muted);font-style:italic;font-size:13px;padding:6px 0}
  /* ---- metric families (Equity vs Enterprise) + cheat-sheet ---- */
  .mf-fam{margin:4px 0 14px}
  .mf-fam:last-child{margin-bottom:0}
  .mf-fam h3{margin:0 0 6px;font-size:12.5px;color:var(--bd-teal);text-transform:uppercase;letter-spacing:.5px}
  table.mf td.mname{font-weight:600;cursor:help}
  table.mf td.mname .info{color:var(--muted);font-weight:400;font-size:11px;margin-left:3px}
  table.mf td.val{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
  .tint-cheap{color:#1c7a50}.tint-rich{color:#b23b4c}.tint-fair{color:var(--ink)}
  /* the cheat-sheet column: greyed, hidden on normal screen (tooltip serves), shown in print */
  th.cheat,td.cheat{display:none;color:var(--muted);font-size:11px;font-weight:400;white-space:normal}
  /* mobile <details> cheat-sheet: hidden on desktop, shown at ≤560px */
  details.cheat-m{display:none;margin:6px 0 0}
  details.cheat-m summary{font-size:12px;color:var(--muted);font-weight:600}
  details.cheat-m .row{padding:6px 0;border-bottom:1px solid var(--line);font-size:12px}
  details.cheat-m .row:last-child{border-bottom:0}
  details.cheat-m .row b{color:var(--ink)}
  img.chart{max-width:100%;height:auto;border:1px solid var(--line);border-radius:10px;margin:8px 0}
  details{margin:0 0 16px}
  summary{cursor:pointer;font-weight:600;color:var(--bd-teal);padding:6px 0}
  .md h1,.md h2,.md h3,.md h4{color:var(--ink)} .md table{margin:8px 0} .md blockquote{border-left:3px solid var(--line);margin:8px 0;padding:2px 12px;color:var(--muted)}
  footer{grid-column:1/-1;border-top:1px solid var(--line);margin-top:8px;padding-top:12px;color:var(--muted);font-size:12px}
  /* ---- THESIS DUEL (v4.3) ---- */
  table.duel{width:100%;table-layout:fixed}
  table.duel th.duel-lbl{width:16%;text-align:left;vertical-align:top;color:var(--muted);font-size:12.5px}
  table.duel td{vertical-align:top;font-size:13.5px}
  table.duel td.duel-0{border-left:3px solid var(--bd-green)}
  table.duel td.duel-1{border-left:3px solid var(--reject)}
  .lean{margin:12px 0 2px;padding:11px 14px;border-radius:11px;border:1px solid var(--line);
    border-left-width:4px;background:var(--bg)}
  .lean.bull{border-left-color:var(--bd-green)} .lean.bear{border-left-color:var(--reject)}
  .lean.even{border-left-color:var(--muted)}
  .lean-k{font-size:10.5px;font-weight:700;letter-spacing:1.1px;color:var(--muted);margin-right:7px}
  .lean-why{margin-top:5px;font-size:13.5px;color:var(--ink)}
  /* ---- COVER — page 1 (v4.3) ---- */
  .cover{grid-column:1/-1;background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:22px 24px 20px;box-shadow:var(--shadow);margin-bottom:16px}
  .cv-verb{display:inline-block;font-size:13px;font-weight:800;letter-spacing:1.6px;
    padding:5px 12px;border-radius:7px;background:var(--bd-green);color:#fff;margin-bottom:10px}
  .cv-tk{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:14px}
  .cv-tk .sub{font-size:14px;font-weight:500}
  .cv-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;
    margin-bottom:12px}
  .cv-fact{border:1px solid var(--line);border-radius:10px;padding:8px 11px}
  .cv-fact .k{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
  .cv-fact .v{font-size:16px;font-weight:700;margin-top:2px}
  .cv-stars{font-size:12.5px;color:var(--muted);margin:2px 0 12px}
  .cv-line{font-size:13.5px;line-height:1.5;margin:7px 0;padding-left:11px;border-left:3px solid var(--line)}
  .cv-line b{margin-right:6px;text-transform:uppercase;font-size:11px;letter-spacing:.8px;color:var(--muted)}
  .cv-bull{border-left-color:var(--bd-green)} .cv-bear{border-left-color:var(--reject)}
  .cv-h{margin:16px 0 8px;font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
  .cv-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
  .cv-grp{border:1px solid var(--line);border-radius:10px;padding:9px 11px}
  .cv-grp h4{margin:0 0 6px;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--bd-teal)}
  .cv-m{display:flex;justify-content:space-between;gap:8px;font-size:12.7px;padding:2px 0}
  .cv-m span{color:var(--muted)} .cv-m b{font-variant-numeric:tabular-nums;white-space:nowrap}
  /* Print: the cover MUST be page 1 on its own. Measured at A4 (726px content width,
     1039px content height at 96dpi) the default spacing overflowed by ~42px once the
     branded header and the disclaimer were counted, which would have pushed the key
     financials onto page 2 — the exact failure the cover exists to prevent. The type size
     is deliberately NOT reduced (a cover that needs a magnifying glass defeats the
     purpose); the recovered space comes from padding and gaps. */
  @media print{
    /* The screen header stacks name / sub / decide over ~190px and every fact in it is
       repeated on the cover directly below. In print it collapses to a slim brand band,
       which is both better print typography and the ~90px that stops a long thesis from
       pushing the key financials onto page 2 (CSCO overflowed by 14px without it). */
    header{padding:10px 14px}
    .hdr-mid .tk{font-size:17px}
    .hdr-mid .decide{display:none}
    .brand-icon{width:34px;height:34px}
    .dial{width:52px;height:52px;font-size:18px}
    .disc{margin-top:9px;padding:6px 11px;font-size:10.5px}
    .cover{page-break-after:always;break-after:page;box-shadow:none;border:none;padding:0}
    .cover .cv-tk{font-size:21px;margin-bottom:9px}
    .cover .cv-verb{margin-bottom:7px}
    .cover .cv-facts{gap:7px;margin-bottom:8px}
    .cover .cv-fact{padding:6px 9px}
    .cover .cv-stars{margin:0 0 8px}
    .cover .cv-line{margin:4px 0}
    .cover .cv-h{margin:11px 0 6px}
    .cover .cv-groups{gap:7px}
    .cover .cv-grp{padding:7px 9px}
    .cover .cv-m{padding:1px 0}
  }
  /* ---- VALUATION METHODS COMPARED (v4.3) ---- */
  table.vc{width:100%} table.vc td,table.vc th{padding:6px 8px;border-bottom:1px solid var(--line)}
  table.vc td:first-child,table.vc th:first-child{white-space:nowrap;width:1%}
  table.vc tr.vc-out td{color:var(--muted)} table.vc tr.vc-blend td{background:var(--bg)}
  .vc-up{color:var(--bd-green);font-weight:700} .vc-down{color:var(--reject);font-weight:700}
  .vc-warn{background:#fdf1f1;border:1px solid #f3cfcf;border-left:4px solid var(--reject);
    border-radius:10px;padding:10px 13px;margin-bottom:11px;font-size:13.3px;color:#7d2b2b}
  /* ---- STAR RATINGS (v4.3) ---- */
  .stars-overall{font-size:15px;margin:0 0 10px} .stars-overall b{font-size:20px;color:var(--bd-green)}
  table.stars{width:100%} table.stars td{border-bottom:1px solid var(--line);padding:7px 6px}
  table.stars td.sname{font-weight:600;width:38%}
  .stars-on{font-size:17px;letter-spacing:2px;color:var(--bd-green)}
  .stars-na{font-size:13px;color:var(--muted)}
  /* ---- SWOT (v4.3) ---- */
  .swot-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .swot-q{border:1px solid var(--line);border-radius:11px;padding:0 0 10px;overflow:hidden}
  .swot-q h3{margin:0 0 8px;padding:8px 12px;font-size:13px;color:#fff;background:var(--muted)}
  .swot-q p{margin:0;padding:0 13px;font-size:13.3px;line-height:1.55}
  .swot-threat h3{background:var(--reject)} .swot-strength h3{background:var(--bd-green)}
  .swot-weakness h3{background:#B8860B} .swot-opportunity h3{background:var(--bd-teal)}
  @media(max-width:640px){.swot-grid{grid-template-columns:1fr}}
  /* ---- PRINT ---- */
  @media print{
    @page{size:A4;margin:11mm 9mm}
    html,body{background:#fff}
    body{font-size:11pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .wrap{display:block;max-width:none;padding:0}
    nav{display:none}
    header{border-radius:0}
    .card,.metric,.side,.hero{box-shadow:none}
    .metric,.side,.exit-grid .box,.op .oc,.swot-q,.lean{break-inside:avoid;page-break-inside:avoid}
    .flags li,tbody tr{break-inside:avoid}
    th.cheat,td.cheat{display:table-cell}          /* grey cheat column visible in print */
    details.cheat-m{display:none!important}          /* mobile block never prints */
    details>*:not(summary){display:block!important}
    summary{list-style:none;font-weight:700;font-size:13pt;color:var(--ink)}
    summary::-webkit-details-marker{display:none}
    a{color:inherit;text-decoration:none}
  }
  /* ---- RESPONSIVE ---- */
  @media(max-width:900px){.wrap{grid-template-columns:1fr;gap:16px}nav{display:none}}
  @media(max-width:560px){
    body{font-size:14.5px}
    .wrap{padding:0 12px 46px}
    header{grid-template-columns:1fr;gap:12px;text-align:left}
    .hdr-right{justify-content:flex-start}
    .strip{grid-template-columns:repeat(2,1fr)}
    .exit-grid{grid-template-columns:1fr}
    .card table{display:block;overflow-x:auto;white-space:nowrap}
    table.mf td.mname .info{display:none}          /* drop inline hint; details covers it */
    details.cheat-m{display:block}                   /* mobile cheat-sheet on */
  }
  @media(max-width:360px){
    .strip{grid-template-columns:1fr}
    .hdr-mid .tk{font-size:18px}
    .hdr-mid .decide{font-size:12.5px}
    .wm{font-size:19px}
  }
</style>
</head>
<body>
{{BODY}}
</body>
</html>
