<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 84" width="340" height="84" role="img" aria-label="BD Finance — Equity Research">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F8A5B"/>
      <stop offset="1" stop-color="#0E6E6E"/>
    </linearGradient>
  </defs>
  <!-- Badge -->
  <rect x="6" y="14" width="56" height="56" rx="14" fill="url(#badge)"/>
  <!-- uptrend candlesticks inside badge -->
  <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.95">
    <line x1="20" y1="52" x2="20" y2="40"/>
    <line x1="28" y1="52" x2="28" y2="32"/>
    <line x1="36" y1="52" x2="36" y2="36"/>
    <line x1="44" y1="52" x2="44" y2="26"/>
  </g>
  <path d="M18 56 L28 46 L36 50 L48 34" fill="none" stroke="#E8B23A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Wordmark -->
  <text x="76" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700">
    <tspan fill="#1F8A5B">BD</tspan><tspan fill="#1B2A32"> Finance</tspan>
  </text>
  <text x="78" y="63" font-family="Arial, Helvetica, sans-serif" font-size="10.5" letter-spacing="4" fill="#E8B23A" font-weight="700">EQUITY RESEARCH</text>
</svg>
